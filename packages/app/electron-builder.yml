appId: com.mufu.app
productName: mufu
directories:
  output: ../../release
files:
  - dist/**/*
  - dist-electron/**/*.js
  - package.json
extraResources:
  - from: resources/daemon.cjs
    to: daemon.cjs
  - from: resources/workflows
    to: workflows
  - from: resources/node_modules
    to: node_modules
mac:
  # 不用开发者证书。hardened runtime 是默认，和 ad-hoc（codesign --sign -）冲突：
  # 它会按 Team ID 拒绝 Electron 自带的 framework。公证同样要正式证书，这里关掉。
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  # 显式打开 asar 合并。@electron/universal 在文件只出现在一个架构、或不匹配 singleArchFiles，
  # 以及两边都有但内容不同的非 Mach-O 文件时直接抛错，不会悄悄丢掉。内容相同的 JS 会留下来。
  # false 且两边哈希不同时，app.asar 会换成入口桩，真正的文件进 app-x64.asar / app-arm64.asar。
  # 不设 singleArchFiles / x64ArchFiles：独有文件应当让构建失败。
  mergeASARs: true
  category: public.app-category.developer-tools
  target:
    - target: dir
      arch:
        - universal
npmRebuild: false
